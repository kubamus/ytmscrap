name: Tests
on:
  push:
  pull_request:
jobs:
  bash-cli:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline CLI tests
        run: bash tests/test-cli.sh
      - name: Offline installer tests
        run: bash tests/test-install.sh
  genre-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install 'mutagen>=1.47,<2'
      - run: python -m unittest discover -s tests -p 'test_genres.py' -v
