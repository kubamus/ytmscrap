name: Genre tagger tests

on:
  pull_request:
    paths:
      - "genre_tagger.py"
      - "tests/test_genre_tagger.py"
      - ".github/workflows/genre-tests.yml"
  push:
    paths:
      - "genre_tagger.py"
      - "tests/test_genre_tagger.py"
      - ".github/workflows/genre-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install 'mutagen>=1.47,<2' 'certifi>=2025.1.31' 'Pillow>=10,<13'
      - run: python -m unittest discover -s tests -v
